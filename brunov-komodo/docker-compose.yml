version: "3"
services:

  mongo:
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: komodo
  
  core:
    image: ghcr.io/moghtech/komodo-core:2.2.0
    init: true
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - mongo
    logging:
      driver: local
    ports:
      - 9120:9120
    environment:
      - KOMODO_TITLE=Komodo
      - KOMODO_DATABASE_ADDRESS=mongo:27017
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_WEBHOOK_SECRET=${APP_SEED:-komodo_webhook_secret}
      - KOMODO_JWT_SECRET=${APP_SEED:-komodo_jwt_secret}
      - KOMODO_JWT_TTL=1-day
      - TZ=America/Sao_Paulo # Change this to your timezone
    volumes:
      - ${APP_DATA_DIR}/keys:/config/keys
      - ${APP_DATA_DIR}/keys:/backups

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.2.0
    init: true
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - core
    logging:
      driver: local
    environment:
      - PERIPHERY_SSL_ENABLED=true
      - PERIPHERY_INCLUDE_DISK_MOUNTS=/etc/hostname
      - TZ=America/Sao_Paulo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      - ${APP_DATA_DIR}/keys:/config/keys

volumes:
  # Mongo
  mongo-data:
  mongo-config:
  # Core / Peryphery
  keys: