version: "3"
services:

  mongo:
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD: komodo
  
  core:
    image: ghcr.io/moghtech/komodo-core:2.2.0
    init: true
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - mongo
    logging:
      driver: local
    ports:
      - 9120:9120
    environment:
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_DATABASE_ADDRESS: brunov-komodo_mongo_1:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD: komodo
      KOMODO_PASSKEY: ${APP_PASSWORD}
      KOMODO_FIRST_SERVER: https://brunov-komodo_periphery_1:8120
      KOMODO_JWT_SECRET: ${APP_SEED}
      TZ: America/Sao_Paulo # Change this to your timezone
    volumes:
      - ${APP_DATA_DIR}/data/core:/backups
      - ${APP_DATA_DIR}/data/keys:/config/keys

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.2.0
    init: true
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - core
    logging:
      driver: local
    environment:
      COMPOSE_KOMODO_IMAGE_TAG: latest
      KOMODO_PASSKEY: ${APP_PASSWORD}
      TZ: America/Sao_Paulo
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PASSKEYS: ${APP_PASSWORD}
      PERIPHERY_DISABLE_TERMINALS: "false"
      PERIPHERY_SSL_ENABLED: "true"
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      PERIPHERY_LOGGING_PRETTY: "false"
      PERIPHERY_PRETTY_STARTUP_CONFIG: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - ${APP_DATA_DIR}/data/periphery:/etc/komodo

volumes:
  # Mongo
  mongo-data:
  mongo-config:
  # Core / Peryphery
  keys: